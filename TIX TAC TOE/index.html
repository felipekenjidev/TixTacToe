<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TixTacToe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
    <h1>
        <img src="images/logo_tixtactoe.png" alt="TixTacToe">
    </h1>

    <main>
        <aside id="jogador1" class="placar-pontuacao vencedor">
            <h2>JOGADOR 1</h2>
            <p id="placar">0</p>
            <p id="mensagem-vitoria">GANHOU!</p>
        </aside>
    
        <figure>
            <div id="grade-jogo">
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
            </div>
    
            <div class="barra-cinza barra-vertical"></div>
            <div class="barra-cinza barra-vertical"></div>
            <div class="barra-cinza barra-horizontal"></div>
            <div class="barra-cinza barra-horizontal"></div>
        </figure>
    
        <aside id="jogador2" class="placar-pontuacao vencedor">
            <h2>JOGADOR 2</h2>
            <p id="placar">0</p>
            <p id="mensagem-vitoria">GANHOU!</p>
        </aside>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
