<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TixTacToe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@100;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
    <div id="caixa-formulario">
        <img src="images/logo_tixtactoe.png" alt="TixTacToe">
        <p>ESCOLHA OS SEUS JOGADORES</p>
        <form>
            <div>
                <label>JOGADOR 1:</label>
                <input type="text" name="txtJogador1" id="input-jogador1" placeholder="Digite o nome do jogador">
            </div>
            <div>
                <label>JOGADOR 2:</label>
                <input type="text" name="txtJogador2" id="input-jogador2" placeholder="Digite o nome do jogador">
            </div>
            <button type="submit">COMEÇAR</button>
        </form>
    </div>

    <div id="fundo-jogador1" class="tela-fundo"></div>
    <div id="fundo-jogador2" class="tela-fundo"></div>

    <img src="images/logo_tixtactoe.png" alt="TixTacToe">
    <p id="mensagem" class="vez-jogador1">É A VEZ DO JOGADOR 1</p>
    <main>
        <aside id="jogador1" class="placar-pontuacao">
            <p class="nome-jogador">JOGADOR 1</p>
            <p class="placar">0</p>
            <p class="mensagem-vitoria">GANHOU!</p>
        </aside>
    
        <figure>
            <div id="grade-jogo">
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
                <div class="area-grade"></div>
            </div>
    
            <div class="barra-cinza barra-vertical"></div>
            <div class="barra-cinza barra-vertical"></div>
            <div class="barra-cinza barra-horizontal"></div>
            <div class="barra-cinza barra-horizontal"></div>
        </figure>
    
        <aside id="jogador2" class="placar-pontuacao">
            <p class="nome-jogador">JOGADOR 2</p>
            <p class="placar">0</p>
            <p class="mensagem-vitoria">GANHOU!</p>
        </aside>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
